name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requires Dependency graph (Settings → Code security and analysis).
      # Soft-fail when the feature is unavailable so PRs are not blocked on
      # repo settings; real high-severity findings still surface as warnings.
      - name: Dependency Review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - name: Report dependency review status
        if: steps.review.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Dependency Review did not succeed. Enable Dependency graph at Settings → Code security and analysis if it is off: https://github.com/${{ github.repository }}/settings/security_analysis"
