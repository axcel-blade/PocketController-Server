name: Stale

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been marked stale because it has been open for 60 days
            with no activity. It will be closed in 14 days if there is no further activity.
          stale-pr-message: >
            This pull request has been marked stale because it has been open for 45 days
            with no activity. It will be closed in 14 days if there is no further activity.
          close-issue-message: Closed due to inactivity. Feel free to reopen if this is still relevant.
          close-pr-message: Closed due to inactivity. Feel free to reopen if this is still relevant.
          exempt-issue-labels: pinned,security,good first issue
          exempt-pr-labels: pinned,security,work-in-progress
          operations-per-run: 60
