name: License Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  license:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project license file
        shell: pwsh
        run: |
          $license = @('LICENSE.md', 'LICENSE', 'LICENSE.txt') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $license) {
            throw "Missing LICENSE.md (or LICENSE) at repository root."
          }
          $text = Get-Content $license -Raw
          if ($text -notmatch 'MIT License') {
            throw "Expected an MIT license notice in $license."
          }
          Write-Host "Project license file looks like MIT ($license)."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PocketControllerServer.slnx -r win-x64

      - name: List package licenses
        shell: pwsh
        run: |
          # dotnet-project-licenses 2.7.1 targets net7.0; runners only ship newer runtimes.
          $env:DOTNET_ROLL_FORWARD = "LatestMajor"
          dotnet tool install --global dotnet-project-licenses --version 2.7.1
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet-project-licenses -i . -o --outfile artifacts/licenses.txt --include-project-file
          if (-not (Test-Path artifacts/licenses.txt)) {
            throw "License report was not written to artifacts/licenses.txt"
          }
          Get-Content artifacts/licenses.txt

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: licenses-${{ github.sha }}
          path: artifacts/licenses.txt
          retention-days: 14
