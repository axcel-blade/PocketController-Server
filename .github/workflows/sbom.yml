name: SBOM

on:
  push:
    branches: [main, develop]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sbom:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PocketControllerServer.slnx -r win-x64

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX --version 5.4.0
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet CycloneDX PocketControllerServer.csproj -o artifacts -f json -fn PocketController-Server-sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: artifacts/PocketController-Server-sbom.cyclonedx.json
          retention-days: 30

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $sbom = "artifacts/PocketController-Server-sbom.cyclonedx.json"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $sbom --clobber
          } else {
            Write-Host "Release $tag not found yet; SBOM artifact uploaded for later attachment."
          }
