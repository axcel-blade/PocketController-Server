name: PR Title Check

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      # Validate from the webhook payload so we do not need extra API scopes
      # (amannn/action-semantic-pull-request fails with "Resource not accessible
      # by integration" when the token cannot read the PR via the REST API).
      - name: Validate PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          title="$PR_TITLE"
          echo "PR title: $title"
          if [[ "$title" =~ ^WIP(:|$) ]]; then
            echo "WIP title allowed."
            exit 0
          fi
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          if [[ ! "$title" =~ ^($types)(\([a-zA-Z0-9_-]+\))?(!)?:\ .+$ ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add release workflow' (WIP titles allowed)."
            exit 1
          fi
          echo "PR title looks good."
