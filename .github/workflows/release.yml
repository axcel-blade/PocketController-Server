name: Release - Server

# Publishes Windows installers only:
#   PocketControllerServer-<version>-win-x64.exe  (setup bootstrapper)
#   PocketControllerServer-<version>-win-x64.msi  (Windows Installer)
# Zip packages are not built or uploaded.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release as .exe + .msi (e.g. 1.2.3). Creates tag v<version> if missing."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".Trim()
            if ($version.StartsWith('app-v', [StringComparison]::OrdinalIgnoreCase)) {
              $version = $version.Substring(5)
            } elseif ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
              $version = $version.Substring(1)
            }
          } else {
            $ref = "${{ github.ref_name }}"
            if ($ref.StartsWith('app-v', [StringComparison]::OrdinalIgnoreCase)) {
              $version = $ref.Substring(5)
            } elseif ($ref.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
              $version = $ref.Substring(1)
            } else {
              $version = $ref
            }
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version '$version'. Expected numeric SemVer like 1.2.3 (tag v1.2.3)."
          }

          $project = 'PocketControllerServer.csproj'
          $projectVersion = ([xml](Get-Content $project)).Project.PropertyGroup.Version |
            Where-Object { $_ } | Select-Object -First 1
          if ($projectVersion -and $projectVersion -ne $version) {
            Write-Warning "Tag/version $version does not match <Version>$projectVersion</Version> in $project."
          }

          $msi = "PocketControllerServer-$version-win-x64.msi"
          $exe = "PocketControllerServer-$version-win-x64.exe"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "msi=$msi" >> $env:GITHUB_OUTPUT
          "exe=$exe" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing PocketController-Server $version (tag v$version)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PocketControllerServer.slnx -r win-x64

      - name: Build
        run: >
          dotnet build PocketControllerServer.slnx
          --no-restore
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: >
          dotnet test Tests/PocketController.Tests.csproj
          --no-restore
          --configuration Release

      - name: Publish self-contained win-x64
        run: >
          dotnet publish PocketControllerServer.csproj
          --no-restore
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet tool run wix -- --version
          dotnet tool run wix -- extension add WixToolset.UI.wixext/5.0.2
          dotnet tool run wix -- extension add WixToolset.BootstrapperApplications.wixext/5.0.2

      - name: Build MSI and EXE installers
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $msiName = '${{ steps.version.outputs.msi }}'
          $exeName = '${{ steps.version.outputs.exe }}'
          $publishDir = Join-Path $PWD 'publish'
          $iconFile = Join-Path $PWD 'Assets\app.ico'
          $licenseRtf = Join-Path $PWD 'installer\License.rtf'
          $artifacts = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Path $artifacts -Force | Out-Null

          $serverExe = Join-Path $publishDir 'PocketControllerServer.exe'
          if (-not (Test-Path $serverExe)) {
            throw "Missing publish output: $serverExe"
          }

          $msiPath = Join-Path $artifacts $msiName
          if (Test-Path $msiPath) { Remove-Item $msiPath -Force }

          dotnet tool run wix -- build installer\Product.wxs `
            -d "Version=$version" `
            -d "PublishDir=$publishDir" `
            -d "IconFile=$iconFile" `
            -d "LicenseRtf=$licenseRtf" `
            -ext WixToolset.UI.wixext `
            -arch x64 `
            -o $msiPath

          if (-not (Test-Path $msiPath)) {
            throw "MSI build failed: $msiPath"
          }

          $bundlePath = Join-Path $artifacts $exeName
          if (Test-Path $bundlePath) { Remove-Item $bundlePath -Force }

          dotnet tool run wix -- build installer\Bundle.wxs `
            -d "Version=$version" `
            -d "MsiPath=$msiPath" `
            -d "IconFile=$iconFile" `
            -ext WixToolset.BootstrapperApplications.wixext `
            -arch x64 `
            -o $bundlePath

          if (-not (Test-Path $bundlePath)) {
            throw "EXE bootstrapper build failed: $bundlePath"
          }

          Get-ChildItem $artifacts | Format-Table Name, Length

      - name: Compose release notes
        id: notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $msi = '${{ steps.version.outputs.msi }}'
          $exe = '${{ steps.version.outputs.exe }}'
          $changelog = Get-Content CHANGELOG.md -Raw

          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(?<body>.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          $section = if ($match.Success) { $match.Groups['body'].Value.Trim() } else { '' }

          $notes = @(
            "Windows installers for PocketController-Server $version (self-contained, 64-bit).",
            "",
            "- ``$exe``: recommended setup bootstrapper. Installs the MSI and adds a Start Menu shortcut.",
            "- ``$msi``: Windows Installer package for silent/enterprise installs (``msiexec /i $msi``).",
            "- No separate .NET runtime install required.",
            "- Still requires the [ViGEmBus driver](https://github.com/nefarius/ViGEmBus/releases)."
          ) -join "`n"

          if ($section) {
            $notes += "`n`n$section"
          }

          $path = "artifacts/release-notes-$version.md"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Set-Content -Path $path -Value $notes -Encoding utf8
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Ensure tag exists
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (-not (git rev-parse -q --verify "refs/tags/$tag")) {
            git tag -a $tag -m "PocketController-Server ${{ steps.version.outputs.version }}"
            git push origin $tag
          }

      - name: Publish GitHub Release (exe + msi)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $notes = '${{ steps.notes.outputs.path }}'
          $msiName = '${{ steps.version.outputs.msi }}'
          $exeName = '${{ steps.version.outputs.exe }}'
          $msi = "artifacts/$msiName"
          $exe = "artifacts/$exeName"

          foreach ($file in $msi, $exe, $notes) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }

          if (gh release view $tag 2>$null) {
            # Drop legacy zip (or any non-installer) assets if this tag was published before.
            $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null
            foreach ($asset in $assets) {
              if ($asset -and $asset -ne $msiName -and $asset -ne $exeName) {
                Write-Host "Removing obsolete release asset: $asset"
                gh release delete-asset $tag $asset --yes
              }
            }

            gh release upload $tag $msi $exe --clobber
            gh release edit $tag --title "PocketController-Server $version" --notes-file $notes
          } else {
            gh release create $tag $msi $exe `
              --title "PocketController-Server $version" `
              --notes-file $notes `
              --verify-tag
          }

          Write-Host "Released $tag with:"
          Write-Host "  - $exeName"
          Write-Host "  - $msiName"
